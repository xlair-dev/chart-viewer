[package]
name = "chart-viewer-parser"
version = "0.1.0"
edition = "2024"
description = "Browser-side chart parser for chart-viewer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chart = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "e58f41e2a099e98f5d39c7784be8775a881bec08" }
chart-converter = { git = "https://github.com/xlair-dev/ChartConverter.git", rev = "e58f41e2a099e98f5d39c7784be8775a881bec08" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.105"
